<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Green Encyclopedia</title>
<style>
:root{--ink:#1d2a22;--paper:#f8f6ec;--paper2:#efecdd;--desk:#10231a;--desk2:#18332a;--accent:#2e8b57;--line:#d9d5c2;--muted:#6b7568}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at top,var(--desk2),var(--desk));color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#e6f2e6;flex:none}
header h1{font-size:18px;margin:0;font-weight:normal;letter-spacing:.06em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.08);color:#e6f2e6;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 12px;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.18)}
.wrap{flex:1;display:flex;min-height:0}
/* sidebar */
#toc{width:310px;flex:none;background:var(--paper);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0;transition:margin-left .25s}
#toc.closed{margin-left:-310px}
#toc .tochead{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#tocclose{display:none}
#toc h2{margin:0 0 8px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:normal}
#search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff}
#toclist{overflow:auto;flex:1;padding:6px 0 20px;font-size:14px}
.trow{display:flex;align-items:center}
.trow .caret{background:none;border:0;width:28px;height:30px;color:var(--muted);font-size:11px;flex:none}
.trow .tname{flex:1;background:none;border:0;text-align:left;padding:6px 4px;color:var(--ink);font-weight:bold}
.trow .tname:hover,.titem:hover{background:var(--paper2)}
.trow .cnt{color:var(--muted);font-size:12px;padding-right:12px}
.trow.cur .tname{color:var(--accent)}
.tsub{display:none}
.tsub.open{display:block}
.titem{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;text-align:left;padding:4px 10px 4px 30px;color:var(--ink);font-size:13.5px}
.titem.cur{background:#dfeeda}
.dot{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.titem .hx{margin-left:auto;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.titem[draggable]{cursor:grab;position:relative}
.titem[draggable]::before{content:"⋮⋮";position:absolute;left:11px;color:var(--muted);font-size:11px;letter-spacing:-2px}
.mosaic button[draggable]{cursor:grab}
.dragging{opacity:.4}
.titem.dropb{box-shadow:inset 0 3px 0 var(--accent)}.titem.dropa{box-shadow:inset 0 -3px 0 var(--accent)}
.mosaic .dropb{box-shadow:-4px 0 0 var(--ink)}.mosaic .dropa{box-shadow:4px 0 0 var(--ink)}
.btn.small{font-size:13px;padding:6px 10px}
.titem.sel{background:#cfe6c8;box-shadow:inset 4px 0 0 var(--accent)}
.mosaic button.sel{outline:3px solid var(--ink);outline-offset:1px}
#selbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:13px}#selbar[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#14251b;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:20;font-size:14px;display:flex;gap:12px;align-items:center}#toast[hidden]{display:none}
#bk{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(8,20,14,.6);display:flex;align-items:center;justify-content:center;padding:14px}#bk[hidden]{display:none}
#bktext{width:100%;height:32vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}
#dlg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(8,20,14,.6);display:flex;align-items:center;justify-content:center;padding:18px}#dlg[hidden]{display:none}
.dlgbox{background:var(--paper);border-radius:10px;padding:22px 22px 18px;max-width:440px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#dlgmsg{white-space:pre-wrap;line-height:1.5;font-size:16px;overflow-wrap:anywhere}
#selbar span{flex:1 0 100%}#selmove{flex:1;min-width:0}#selbar .btn{font-size:12px;padding:5px 8px}
.subrow{padding-left:14px;cursor:grab}.subrow .tname{font-weight:normal;font-style:italic}
.titem.deep{padding-left:48px}.titem.deep[draggable]::before{left:30px}
.tsub.dropa{box-shadow:inset 0 -3px 0 var(--accent);min-height:3px}
.trow.dropb{box-shadow:inset 0 3px 0 var(--accent)}.trow.dropa{box-shadow:inset 0 -3px 0 var(--accent)}
.dropin{background:#dfeeda!important;outline:2px dashed var(--accent);outline-offset:-2px}
.glabel{margin:16px 0 6px;padding:4px 6px;border-radius:4px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.glabel b{color:var(--ink);font-weight:normal;font-style:italic;font-size:15px}
select.field{width:auto;margin:0;padding:6px 8px;font-size:13px}
.cover .cr{margin-top:22px;font-size:14px;line-height:1.7;opacity:.9}.cover .cr small{font-size:12px;opacity:.85}
.tdiv{margin:8px 14px;border-top:1px solid var(--line)}
.tnote{padding:8px 30px;color:var(--muted);font-size:13px;font-style:italic}
/* book */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 18px;min-height:0;perspective:2200px}
.book{width:min(1100px,100%);height:min(680px,100%);display:flex;background:var(--paper);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 6px #0a1711;position:relative}
.leaf{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.leaf.l{border-radius:6px 0 0 6px;box-shadow:inset -18px 0 24px -18px rgba(0,0,0,.35)}
.leaf.r{border-radius:0 6px 6px 0;box-shadow:inset 18px 0 24px -18px rgba(0,0,0,.25);padding:34px 38px;overflow:auto}
.flip-f .leaf.r{animation:ff .38s ease-out;transform-origin:left center}
.flip-b .leaf.l{animation:fb .38s ease-out;transform-origin:right center}
@keyframes ff{from{transform:rotateY(-75deg);opacity:.3}to{transform:none;opacity:1}}
@keyframes fb{from{transform:rotateY(75deg);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flip-f .leaf.r,.flip-b .leaf.l{animation:none}}
.swatch{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 30px}
.swatch .big{font-size:30px;line-height:1.15}
.swatch .sm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;opacity:.85;margin-top:6px}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.r h2{font-size:34px;font-weight:normal;margin:8px 0 22px;line-height:1.1;overflow-wrap:anywhere}
.vals{width:100%;border-collapse:collapse}
.vals td{padding:13px 0;border-top:1px solid var(--line);vertical-align:middle}
.vals tr:last-child td{border-bottom:1px solid var(--line)}
.vals td:first-child{width:70px;font-size:12px;letter-spacing:.16em;color:var(--muted)}
.vals .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px}
.copy{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 9px;font-size:12px;color:var(--muted);float:right}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.pgno{margin-top:auto;padding-top:18px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:15px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.danger{background:none;color:#a33;border:1px solid #dcc;font-size:13px;padding:6px 10px}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:16px;margin:6px 0 14px}
label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{min-height:22px;font-size:14px;margin:10px 0;color:var(--accent)}
.msg.warn{color:#a66a00}.msg.err{color:#a33}
p{line-height:1.55}
.cover{flex:1;background:linear-gradient(135deg,#0d3b24,#1f6b44 55%,#0f4a2e);color:#eaf6e4;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;border:10px double rgba(234,246,228,.35);margin:14px;border-radius:4px}
.cover .t1{letter-spacing:.4em;font-size:13px;text-transform:uppercase;opacity:.8}
.cover .t2{font-size:52px;line-height:1.05;margin:16px 0}
.cover .t3{font-style:italic;opacity:.85}
.contents{list-style:none;margin:0;padding:0}
.contents li{border-top:1px dotted var(--line)}
.contents button{display:flex;width:100%;background:none;border:0;padding:7px 2px;text-align:left;color:var(--ink);font-size:15.5px}
.contents button:hover{color:var(--accent)}
.contents .c{margin-left:auto;color:var(--muted);font-size:13px}
.sectl{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 36px;color:#fff}
.sectl .n{font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.sectl .nm{font-size:46px;line-height:1.05;margin:10px 0}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.mosaic button{aspect-ratio:1;border:0;border-radius:3px;padding:0}
.mosaic button:hover{outline:2px solid var(--ink);outline-offset:1px}
footer{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;color:#cfe3cf;font-size:14px}
footer input{width:70px;text-align:center;padding:5px;border-radius:5px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.nav{background:#e6f2e6;color:#10231a;border:0;border-radius:50px;padding:8px 18px;font-size:15px}
.nav:disabled{opacity:.35;cursor:default}
@media (max-width:820px){
 @supports (height:100dvh){body{height:100dvh}}
 #toc{position:fixed;z-index:5;top:0;bottom:0;left:0;box-shadow:0 0 40px #000;width:min(310px,86vw);transition:transform .25s}
 #toc.closed{margin-left:0;transform:translateX(-110%);box-shadow:none}
 #tocclose{display:block;float:right;color:var(--ink);border-color:var(--line);background:#fff;font-size:13px;padding:4px 10px;margin-top:-4px}
 #search,.field,select.field{font-size:16px}
 header{gap:6px;padding:8px 10px}
 .hbtn{font-size:13px;padding:6px 8px;white-space:nowrap}
 .stage{padding:4px 8px}
 footer{gap:6px;padding:8px 6px;font-size:13px}
 .nav{padding:8px 12px;font-size:14px}
 footer input{width:58px}
 #toast{bottom:58px;width:max-content;max-width:92vw}
 .book{flex-direction:column;height:100%}
 .leaf.l{flex:0 0 38%;border-radius:6px 6px 0 0}
 .leaf.r{border-radius:0 0 6px 6px;padding:20px}
 .r h2{font-size:26px;margin-bottom:12px}
 .cover .t2{font-size:30px;margin:8px 0}.sectl .nm{font-size:32px}
 .is-cover .leaf.l{flex:0 0 auto}
 .cover{flex:none;padding:16px 12px;margin:8px;border-width:6px}.cover .t1{font-size:11px}.cover .t3{font-size:14px}.cover .cr{margin-top:10px;font-size:13px;line-height:1.5}
 header h1{font-size:15px}
}
@media (max-width:600px){header h1{display:none}header{justify-content:space-between}}
</style>

const SECTIONS=[];
RAW.split('\n').forEach(line=>{
  if(line[0]==='@') SECTIONS.push({name:line.slice(1),colors:[]});
  else line.split(';').forEach(c=>{const i=c.lastIndexOf(':');SECTIONS[SECTIONS.length-1].colors.push([c.slice(0,i),'#'+c.slice(i+1)])});
});

/* ---------- Colour maths ---------- */
const hexToRgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [Math.round(h)%360,Math.round(s*100),Math.round(l*100)]}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function info(hex){const [r,g,b]=hexToRgb(hex),[h,s,l]=rgbToHsl(r,g,b);
  return {hex:hex.toUpperCase(),rgb:`rgb(${r}, ${g}, ${b})`,hsl:`hsl(${h}, ${s}%, ${l}%)`,h,s,l,ink:(0.299*r+0.587*g+0.114*b)>150?'#14251b':'#ffffff'}}
function parseColor(str){const s=str.trim().toLowerCase();if(!s)return null;
  const m=s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
  if(m){let h=m[1];if(h.length===3)h=h.split('').map(c=>c+c).join('');return '#'+h}
  const n=(s.match(/\d+(\.\d+)?/g)||[]).map(Number);if(n.length!==3)return null;
  if(s.includes('hsl')||s.includes('%')||s.includes('°')){if(n[1]>100||n[2]>100)return null;return hslToHex(n[0]%360,n[1],n[2])}
  if(n.some(x=>x>255))return null;
  return '#'+n.map(x=>Math.round(x).toString(16).padStart(2,'0')).join('')}
/* A true green: green is the strongest of the three colour channels (the same rule the predefined shades meet). */
const looksGreen=hex=>{const [r,g,b]=hexToRgb(hex);return g>r&&g>b};
function randomGreen(){const r=(a,b)=>a+Math.random()*(b-a);return hslToHex(r(72,168),r(22,100),r(12,90))}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Saved shades (kept in this browser) ---------- */
const KEY='greenEncyclopedia.myShades',KEYP='greenEncyclopedia.page';
const KEYS=KEY+'.subsections';
let user=[],subs=[];
try{user=JSON.parse(localStorage.getItem(KEY)||'[]').filter(u=>u&&/^#[0-9a-f]{6}$/.test(u.hex))}catch(e){user=[]}
try{subs=JSON.parse(localStorage.getItem(KEYS)||'[]').filter(x=>x&&x.id&&typeof x.name==='string')}catch(e){subs=[]}
let storageOK=true;
/* Keep shades in page order: those outside any subsection first, then each subsection in turn. */
function normalize(){const rank=id=>subs.findIndex(x=>x.id===id)+1;
  user.forEach(u=>{if(u.sub&&!rank(u.sub))delete u.sub});
  user=user.map((u,i)=>[u,i]).sort((a,b)=>rank(a[0].sub)-rank(b[0].sub)||a[1]-b[1]).map(x=>x[0])}
function persist(){normalize();try{localStorage.setItem(KEY,JSON.stringify(user));localStorage.setItem(KEYS,JSON.stringify(subs))}catch(e){storageOK=false}}
/* Exact-match lookup against the predefined shades */
const PRE={};SECTIONS.forEach(x=>x.colors.forEach(c=>{(PRE[c[1]]=PRE[c[1]]||[]).push([c[0],x.name])}));
const TOTAL=SECTIONS.reduce((a,x)=>a+x.colors.length,0);
function dupNote(hex){hex=hex.toLowerCase();const parts=[],m=PRE[hex],mine=user.filter(u=>u.hex===hex);
  if(m){const by={};m.forEach(([n,sec])=>{(by[n]=by[n]||[]).push(sec)});
    parts.push('in the encyclopedia as '+Object.keys(by).map(n=>`“${esc(n)}” in the ${by[n].map(esc).join(' and ')} section${by[n].length>1?'s':''}`).join(', and as '))}
  if(mine.length)parts.push('in My Shades as '+mine.map(u=>{const x=u.sub&&subs.find(y=>y.id===u.sub);return `“${esc(u.name)}” (${x?'in the '+esc(x.name)+' subsection':'no subsection'})`}).join(' and '));
  return parts.length?'Note: this exact shade is already '+parts.join(', and ')+'. You can still add it.':''}

/* ---------- Pages ---------- */
let pages=[],secStart=[],discoverAt=0,addAt=0,userStart=0,cur=0,discHex=randomGreen(),openSecs=new Set(),uiPage=[],subStart={},openSubs=new Set(subs.map(x=>x.id));
function build(){
  normalize();pages=[{t:'cover'}];secStart=[];
  SECTIONS.forEach((s,si)=>{secStart[si]=pages.length;pages.push({t:'section',si});
    s.colors.forEach((c,ci)=>pages.push({t:'color',name:c[0],hex:c[1],sec:s.name,n:ci+1,of:s.colors.length}))});
  discoverAt=pages.length;pages.push({t:'discover'});
  addAt=pages.length;pages.push({t:'add'});
  userStart=pages.length;pages.push({t:'usersec'});uiPage=[];subStart={};
  const put=(list,label)=>list.forEach((u,k)=>{const ui=user.indexOf(u);uiPage[ui]=pages.length;pages.push({t:'color',name:u.name,hex:u.hex,sec:label,n:k+1,of:list.length,ui,src:u.src})});
  put(user.filter(u=>!u.sub),'My Shades');
  subs.forEach(x=>{subStart[x.id]=pages.length;pages.push({t:'usersub',id:x.id});put(user.filter(u=>u.sub===x.id),'My Shades › '+x.name)});
  document.getElementById('total').textContent=pages.length;
  document.getElementById('pg').max=pages.length;
}
const $=id=>document.getElementById(id);
function valsTable(hex){const i=info(hex);
  return `<table class="vals">
  <tr><td>HEX</td><td><span class="v">${i.hex}</span><button class="copy" data-copy="${i.hex}">Copy</button></td></tr>
  <tr><td>RGB</td><td><span class="v">${i.rgb}</span><button class="copy" data-copy="${i.rgb}">Copy</button></td></tr>
  <tr><td>HSL</td><td><span class="v">${i.hsl}</span><button class="copy" data-copy="${i.hsl}">Copy</button></td></tr></table>`}
function swatch(hex,name){const i=info(hex);
  return `<div class="swatch" id="sw" style="background:${hex};color:${i.ink}"><div class="big">${esc(name)}</div><div class="sm">${i.hex}</div></div>`}
function umosaic(list){return list.length?`<div class="mosaic">`+list.map(u=>{const k=user.indexOf(u);return `<button draggable="true" data-ui="${k}" style="background:${u.hex}" title="${esc(u.name)} ${u.hex.toUpperCase()}" data-go="${uiPage[k]}"></button>`}).join('')+`</div>`:''}
function mosaic(start,list){return `<div class="mosaic">`+list.map((c,k)=>`<button style="background:${c[1]}" title="${esc(c[0])} ${c[1].toUpperCase()}" data-go="${start+1+k}"></button>`).join('')+`</div>`}

function render(){

/* ---------- Table of contents ---------- */
function secOf(n){if(n>=userStart)return 'u';if(n>=discoverAt)return 'w';for(let i=SECTIONS.length-1;i>=0;i--)if(n>=secStart[i])return i;return -1}

    case 'undo':doUndo();break;
    case 'selrm':removeSelected();break;
    case 'selclr':sel.clear();markSel();break;
    case 'tocclose':$('toc').classList.add('closed');break;
    case 'tocbtn':$('toc').classList.toggle('closed');break;
    case 'prev':go(cur-1);break;
    case 'next':go(cur+1);break;
    case 'roll':discHex=randomGreen();{const nm=$('dname').value;render();$('dname').value=nm}break;
    case 'dsave':{const u=addShade(discHex,$('dname').value,'random'),at=uiPage[user.indexOf(u)];render();
      say('dmsg',`Saved “${esc(u.name)}” to ${whereOf(u)}. <button class="copy" style="float:none" data-go="${at}">View page ${at+1}</button>`);break}
    case 'asave':{const hex=updateAddPreview();if(!hex)return say('amsg','Enter a colour as hex, RGB or HSL first.','err');
      const u=addShade(hex,$('aname').value,'manual'),at=uiPage[user.indexOf(u)];$('acol').value='';$('aname').value='';updateAddPreview();render();
      say('amsg',`Added “${esc(u.name)}” to ${whereOf(u)}. <button class="copy" style="float:none" data-go="${at}">View page ${at+1}</button>`);break}
    case 'exp':{const data={app:'green-encyclopedia',version:2,subsections:subs.map(x=>({id:x.id,name:x.name})),shades:user.map(u=>({name:u.name,hex:u.hex,src:u.src,sub:u.sub||null}))};
      const json=JSON.stringify(data,null,1);if(TOUCH){openBackup('export',json);break}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='my-green-shades.json';a.click();break}
    case 'newsub':{const x=newSub();persist();build();renderToc();go(subStart[x.id]);startSubRename();break}
    case 'sren':startSubRename();break;
    case 'sselall':selectGroup(pages[cur].id);break;
    case 'ssave':saveSubRename();break;
    case 'scancel':render();break;
    case 'sdel':case 'sdelall':{const p=pages[cur],x=subs.find(y=>y.id===p.id),members=user.filter(u=>u.sub===x.id),n=members.length,all=t.id==='sdelall',idx=subs.indexOf(x),order=user.slice();
      ask(all?'Delete the subsection "'+x.name+'" AND the '+n+' shade'+(n===1?'':'s')+' inside it?\n\nThe shades will be removed from My Shades. Click OK to delete everything in this subsection.'
        :'Delete the subsection "'+x.name+'"?'+(n?'\n\nIts '+n+' shade'+(n===1?'':'s')+' will not be deleted. They stay in My Shades with no subsection.':'')).then(ok=>{if(!ok||!subs.includes(x))return;
      if(all)user=user.filter(u=>u.sub!==x.id);
      else{members.forEach(u=>delete u.sub);user=user.filter(u=>!members.includes(u));user=user.filter(u=>!u.sub).concat(members,user.filter(u=>u.sub))}
      members.forEach(u=>sel.delete(u));subs=subs.filter(y=>y!==x);openSubs.delete(x.id);persist();build();renderToc();go(userStart,true);
      showUndo(all&&n?`Deleted “${esc(x.name)}” and its ${n} shade${n===1?'':'s'}.`:`Deleted the subsection “${esc(x.name)}”.`,()=>{
        if(!subs.includes(x))subs.splice(Math.min(idx,subs.length),0,x);openSubs.add(x.id);
        members.forEach(u=>{if(!all&&!user.includes(u))return;if(!user.includes(u))user.push(u);u.sub=x.id});
        user=order.filter(u=>user.includes(u)).concat(user.filter(u=>!order.includes(u)));return {s:x.id}})});break}
    case 'imp':if(TOUCH)openBackup('import');else $('importfile').click();break;
    case 'bkclose':$('bk').hidden=true;break;
    case 'bkfile':$('importfile').click();break;
    case 'bkcopy':copyText($('bktext').value,t);break;
    case 'bkimport':if($('bktext').value.trim()){$('bk').hidden=true;importText($('bktext').value)}else say('bknote','Paste the backup text into the box first.','err');break;
    case 'bkshare':{const mk=type=>new File([$('bktext').value],'my-green-shades.json',{type});let f=mk('application/json');
      try{if(!navigator.canShare({files:[f]}))f=mk('text/plain')}catch(x){}
      navigator.share({files:[f]}).catch(err=>{if(err&&err.name!=='AbortError')say('bknote','Sharing is not available in this app. Use Copy text instead.','warn')});break}
  }
});
$('importfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>importText(rd.result);rd.readAsText(f);e.target.value='';$('bk').hidden=true});
function importText(txt){try{const data=JSON.parse(txt),arr=Array.isArray(data)?data:data.shades,isubs=Array.isArray(data)?[]:(data.subsections||[]);
    if(!Array.isArray(arr)||!Array.isArray(isubs))throw 0;let n=0;
    const finish=replace=>{if(replace){user=[];subs=[];openSubs.clear()}
    const map={};isubs.forEach(x=>{if(!x||x.id==null)return;const nm=String(x.name||'Untitled subsection').slice(0,40);let mine=subs.find(y=>y.name===nm);if(!mine){mine=newSub(nm)}map[x.id]=mine.id});
    arr.forEach(u=>{const hex=u&&parseColor(String(u.hex||''));if(!hex)return;const name=String(u.name||hex.toUpperCase()).slice(0,40),sub=map[u.sub];
      if(user.some(x=>x.hex===hex&&x.name===name&&(x.sub||undefined)===sub))return;const o={name,hex,src:u.src==='random'?'random':'manual'};if(sub)o.sub=sub;user.push(o);n++});
    persist();build();renderToc();go(userStart,true);notify('Imported '+n+' shade'+(n===1?'':'s')+(isubs.length?' and '+isubs.length+' subsection'+(isubs.length===1?'':'s'):'')+'.')};
    if(user.length||subs.length)ask('Replace your current My Shades with the ones in this file?\n\nReplace = My Shades becomes exactly what is in the file (its shades, names, order and subsections).\n\nAdd to mine = keep what you have and add the file\'s shades to it.','Replace','Add to mine').then(finish);else finish(false)}catch(err){notify('That could not be read as a shades backup.')}}
document.addEventListener('change',e=>{
  if(e.target.dataset.sortsub!==undefined){if(e.target.value)sortGroup(e.target.dataset.sortsub,e.target.value);return}
  if(e.target.id==='selmove'){const v=e.target.value,list=[...sel];e.target.value='';if(!v||!list.length)return;
    if(v==='__new'){const x=newSub();placeMany(list,x.id,null);go(subStart[x.id]);startSubRename()}else placeMany(list,v==='__none'?'':v,null);return}
  if(e.target.id==='asub'||e.target.id==='dsub'){pickSub=e.target.value;return}if(e.target.id!=='subsel')return;const ui=pages[cur].ui,v=e.target.value;if(ui===undefined)return;
  if(v==='__new'){const x=newSub();user[ui].sub=x.id;persist();build();renderToc();go(subStart[x.id]);startSubRename()}
  else placeShade(ui,v,null)});
document.addEventListener('input',e=>{
  if(e.target.id==='acol'||e.target.id==='aname')updateAddPreview();
  if(e.target.id==='search')renderToc()});
$('pg').addEventListener('change',e=>go(+e.target.value-1));
document.addEventListener('keydown',e=>{
  if(dlgDone){if(e.key==='Escape'){e.preventDefault();closeDlg(false)}else if(e.key==='Enter'){e.preventDefault();closeDlg(document.activeElement!==$('dlgcancel'))}return}
  if(!$('bk').hidden&&e.key==='Escape'){$('bk').hidden=true;return}
  const inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key==='Enter'&&e.target.id==='acol'){$('asave').click();return}
  if(e.key==='Enter'&&e.target.id==='aname'){$('asave').click();return}
  if(e.key==='Enter'&&e.target.id==='dname'){$('dsave').click();return}
  if(e.target.id==='srname'){if(e.key==='Enter')saveSubRename();else if(e.key==='Escape')render();return}
  if(e.target.id==='rname'){if(e.key==='Enter')saveRename();else if(e.key==='Escape')render();return}
  if(inField)return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(e.key==='Escape'){sel.clear();markSel()}
  else if(e.key==='Delete'&&sel.size){e.preventDefault();removeSelected()}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(pages.length-1)});
let tx=null;const bk=$('book');
bk.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
bk.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1))});

/* ---------- Drag to reorder My Shades and its subsections ---------- */
let drag=null;
const clearDrop=()=>document.querySelectorAll('.dropa,.dropb,.dropin,.dragging').forEach(e=>e.classList.remove('dropa','dropb','dropin','dragging'));
function dropInfo(e){if(!drag||!e.target.closest)return null;
  const half=t=>{const r=t.getBoundingClientRect();return t.closest('.mosaic')?e.clientX>r.left+r.width/2:e.clientY>r.top+r.height/2};
  if(drag.ui!==undefined){let t=e.target.closest('[data-ui]');if(t)return {t,kind:'shade',after:half(t)};
    t=e.target.closest('[data-dropsub]');return t?{t,kind:'into'}:null}
  let t=e.target.closest('[data-subrow]');if(t)return {t,kind:'sub',after:half(t)};
  /* over the shades listed inside a subsection: drop the dragged subsection just after it */
  t=e.target.closest('[data-subbody]');if(t)return {t,kind:'subafter'};
  /* in the empty space below the last subsection: make it the last one */
  const all=document.querySelectorAll('#toclist [data-subbody]'),last=all[all.length-1];
  if(last&&e.target.closest('#toclist')){const rows=document.querySelectorAll('#toclist [data-subrow]'),b=Math.max(last.getBoundingClientRect().bottom,rows[rows.length-1].getBoundingClientRect().bottom);
    if(e.clientY>=b-1)return {t:last,kind:'subafter'}}
  return null}
document.addEventListener('dragstart',e=>{if(!e.target.closest)return;let t=e.target.closest('[data-ui]'),label;
  if(t){drag={ui:+t.dataset.ui};const u=user[drag.ui];drag.list=sel.size>1&&sel.has(u)?[...sel]:[u];label=drag.list.length>1?drag.list.length+' shades':u.name;
    if(drag.list.length>1)document.querySelectorAll('[data-ui].sel').forEach(x=>x.classList.add('dragging'))}else{t=e.target.closest('[data-subrow]');if(!t)return;drag={sub:t.dataset.subrow};label='subsection'}
  t.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',label)}catch(x){}});
document.addEventListener('dragover',e=>{const d=dropInfo(e);if(!d)return;e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.dropa,.dropb,.dropin').forEach(x=>x.classList.remove('dropa','dropb','dropin'));d.t.classList.add(d.kind==='into'?'dropin':d.kind==='subafter'||d.after?'dropa':'dropb')});
document.addEventListener('drop',e=>{const d=dropInfo(e);if(!d)return;e.preventDefault();const g=drag;drag=null;clearDrop();
  if(d.kind==='shade'){const r=user[+d.t.dataset.ui];placeMany(g.list,r.sub||'',r,d.after)}
  else if(d.kind==='into')placeMany(g.list,d.t.dataset.dropsub,null);
  else if(d.kind==='subafter')reorderSub(g.sub,d.t.dataset.subbody,true);
  else reorderSub(g.sub,d.t.dataset.subrow,d.after)});
document.addEventListener('dragend',()=>{drag=null;clearDrop()});

/* ---------- Start ---------- */
build();
if(innerWidth<=820)$('toc').classList.add('closed');
renderToc();
let startAt=0;try{startAt=+localStorage.getItem(KEYP)||0}catch(e){}
go(startAt<pages.length?startAt:0,true);
</script>
</body>
</html>
